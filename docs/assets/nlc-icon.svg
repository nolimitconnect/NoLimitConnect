<!--
  NoLimitConnect mark — Brett R. Jones.
  Vector reconstruction of org.nolimitconnect.NoLimitConnect.png, fitted to
  pixel measurements of the original, with one deliberate revision to the
  original design (2026-09-10): the U curve is 0.6 of a degree shallower.

  Geometry:
    * bowl circle: centre (256,177.78), radius 170.85, stroke width 40.
      The arc sweeps 149.3 degrees, 0.6 of a degree less at each end than
      the original's 150.5, which lifts the bottom of the bowl from y=351.7
      to y=348.6 and opens the U very slightly.
    * each colour's ARC and DIAGONAL share one origin ON the circle,
      (106,96) and (406,96), so the U and the line start from the same point
      rather than the U being tucked inward.
    * each arc ends where its own diagonal crosses the circle, so its square
      end is hidden beneath that diagonal.

  Overlaps are computed, not hand-placed. The violet layer is the pink shape
  drawn a second time and masked by the blue shape, so it is exactly
  pink-INTERSECT-blue everywhere: the bowl, the X crossing, and each diagonal
  where it passes over the far arc. The violet therefore ends flush along the
  diagonal's own edge. A butt linecap cannot achieve this — it cuts square to
  the arc, while the diagonal meets the arc at about 75 degrees, which leaves
  the outer edge overshooting and the inner edge short.

  Colours: #FE68B3, #45AEDF and #B09ED6, all sampled unchanged from the source.
  Canvas: square, 526 x 526, viewBox "-7 3 526 526". The artwork's own
  bounding box is 446 x 380 (x 33..479, y 76..456), so the closest edges —
  left and right — clear the canvas by exactly 40, one stroke width. Top and
  bottom clear by 73, the artwork being centred.

  Background is transparent, so the mark sits on light and dark grounds
  alike. Add <rect x="-7" y="3" width="526" height="526" fill="..."/> as the
  first child if a filled square is ever wanted.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-7 3 526 526" role="img"
     aria-label="NoLimitConnect logo: a pink and a blue stroke crossing in an X above a shared semicircular bowl, overlapping in violet.">
  <defs>
    <mask id="blueShape" maskUnits="userSpaceOnUse" x="-20" y="-10" width="560" height="560">
      <g fill="none" stroke="#ffffff" stroke-width="40">
        <path d="M 406 96 A 170.85 170.85 0 0 1 256 348.6 A 170.85 170.85 0 0 1 168.6 324.6"/>
        <path stroke-linecap="round" d="M 406 96 L 53 436"/>
      </g>
    </mask>
  </defs>

  <!-- pink hook -->
  <g fill="none" stroke="#FE68B3" stroke-width="40">
    <path d="M 106 96 A 170.85 170.85 0 0 0 256 348.6 A 170.85 170.85 0 0 0 343.4 324.6"/>
    <path stroke-linecap="round" d="M 106 96 L 459 436"/>
  </g>

  <!-- blue hook: mirror about x=256 -->
  <g fill="none" stroke="#45AEDF" stroke-width="40">
    <path d="M 406 96 A 170.85 170.85 0 0 1 256 348.6 A 170.85 170.85 0 0 1 168.6 324.6"/>
    <path stroke-linecap="round" d="M 406 96 L 53 436"/>
  </g>

  <!-- overlap: the pink hook again in violet, showing only where blue is -->
  <g fill="none" stroke="#B09ED6" stroke-width="40" mask="url(#blueShape)">
    <path d="M 106 96 A 170.85 170.85 0 0 0 256 348.6 A 170.85 170.85 0 0 0 343.4 324.6"/>
    <path stroke-linecap="round" d="M 106 96 L 459 436"/>
  </g>
</svg>
